name: Build & Release Cross-Platform Binaries

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: ProctorX-windows-x86_64.exe
            binary_name: contest_lockdown.exe
          - os: macos-latest
            asset_name: ProctorX-macos-arm64
            binary_name: contest_lockdown
          - os: ubuntu-latest
            asset_name: ProctorX-linux-x86_64
            binary_name: contest_lockdown

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Prepare asset for packaging
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          chmod +x dist/${{ matrix.asset_name }} || true

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded assets
        run: |
          ls -la artifacts/

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
