name: Build Cross-Platform Binaries

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: contest_lockdown-windows-x86_64.exe
            binary_path: target/release/contest_lockdown.exe
          - os: macos-latest
            artifact_name: contest_lockdown-macos-arm64
            binary_path: target/release/contest_lockdown
          - os: ubuntu-latest
            artifact_name: contest_lockdown-linux-x86_64
            binary_path: target/release/contest_lockdown

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Upload compiled binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_path }}
